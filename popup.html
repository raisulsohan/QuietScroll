<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body {
    width: 256px; margin: 0; padding: 16px 18px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1e1e22; color: #e8e8ea;
  }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 16px; letter-spacing: .02em; }
  .block { margin-top: 16px; }
  .row {
    display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 9px;
  }
  .label { font-size: 12px; color: #a8a8ad; }
  .value { font-size: 17px; font-weight: 700; color: #fff; }
  input[type=range] { width: 100%; accent-color: #7c5cff; margin: 0; }
  .ticks {
    display: flex; justify-content: space-between;
    font-size: 10px; color: #6c6c72; margin-top: 4px;
  }
  .toggle-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; margin-top: 14px;
  }
  .toggle-row .label { font-size: 12.5px; color: #e8e8ea; }
  .sub { font-size: 10.5px; color: #76767c; margin-top: 2px; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .track {
    position: absolute; inset: 0; background: #3a3a40;
    border-radius: 11px; transition: .2s; cursor: pointer;
  }
  .track::before {
    content: ""; position: absolute; height: 16px; width: 16px;
    left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s;
  }
  .switch input:checked + .track { background: #7c5cff; }
  .switch input:checked + .track::before { transform: translateX(16px); }
  .switch input:disabled + .track { opacity: .4; cursor: not-allowed; }
  .hint {
    font-size: 11px; color: #76767c; line-height: 1.5;
    margin-top: 15px; padding-top: 12px; border-top: 1px solid #313137;
  }
  .credit {
  margin-top: 12px;
  text-align: center;
  font-size: 10px;
  color: #6f6f75;
  letter-spacing: .04em;
}
</style>
</head>
<body>
  <h1>QuietScroll</h1>

  <div class="row">
    <span class="label">Step per scroll</span>
    <span class="value" id="stepVal">0.5%</span>
  </div>
  <input type="range" id="step" min="0.5" max="10" step="0.5" value="0.5">
  <div class="ticks"><span>0.5%</span><span>10%</span></div>

  <div class="block">
    <div class="row">
      <span class="label">Minimum volume</span>
      <span class="value" id="minVal">0.25%</span>
    </div>
    <input type="range" id="minvol" min="0" max="1" step="0.25" value="0.25">
    <div class="ticks"><span>0%</span><span>1%</span></div>
  </div>

  <div class="toggle-row">
    <div>
      <div class="label">Hold Alt to change volume</div>
      <div class="sub">otherwise the wheel scrolls the page</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="modkey">
      <span class="track"></span>
    </label>
  </div>

  <div class="toggle-row">
    <div>
      <div class="label">Active on this site</div>
      <div class="sub" id="host">&mdash;</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="siteon" checked>
      <span class="track"></span>
    </label>
  </div>

  <div class="hint">সেটিং সব সাইটে প্রযোজ্য ও সংরক্ষিত থাকে। কোনো সাইট বন্ধ করলে সেখানে এক্সটেনশন পুরোপুরি নিষ্ক্রিয় থাকে।</div>
  <div class="credit">Made by Raisul Sohan</div>
  <script src="popup.js"></script>
</body>
</html>
